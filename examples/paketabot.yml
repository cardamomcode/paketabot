name: PaketaBot

on:
  schedule:
    - cron: "17 4 * * 1"
      timezone: "Europe/Oslo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paketabot-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dbrattli/paketabot@main
        with:
          token: ${{ secrets.PAKETABOT_TOKEN }}
