name: PaketaBot reusable workflow

on:
  workflow_call:
    secrets:
      paketabot_token:
        description: Fine-grained token used only by the publish job.
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.resolve.outputs.outcome }}
    steps:
      # decision: pins third-party Actions to reviewed commits so mutable upstream tags cannot change privileged workflows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: Install Paket
        run: dotnet tool install --tool-path "$RUNNER_TEMP/paket" Paket --version 10.3.1
      - name: Resolve dependencies without publisher credentials
        id: resolve
        # decision: uses the release-specific immutable tag so this workflow invokes Action code from the same review
        # invariant: both operation steps in a released workflow reference that workflow's exact release tag
        uses: dbrattli/paketabot@v1.0.0
        with:
          operation: resolve
          paket-path: ${{ runner.temp }}/paket/paket
          result-path: ${{ runner.temp }}/paketabot/result.json
      - name: Upload typed resolution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paketabot-resolution
          path: ${{ runner.temp }}/paketabot/result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: resolve
    if: needs.resolve.outputs.outcome == 'updated'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: paketabot-resolution
          path: ${{ runner.temp }}/paketabot
      - name: Publish guarded dependency update
        # Keep synchronized with the resolve operation's immutable self-reference.
        uses: dbrattli/paketabot@v1.0.0
        with:
          operation: publish
          token: ${{ secrets.paketabot_token }}
          result-path: ${{ runner.temp }}/paketabot/result.json
