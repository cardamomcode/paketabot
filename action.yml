name: PaketaBot operation
description: Resolve or publish one guarded Paket dependency update.

inputs:
  operation:
    description: Either resolve in the credential-free job or publish in the token-bearing job.
    required: true
  token:
    description: Publisher token; required for publish and forbidden for resolve.
    required: false
  result-path:
    description: Path to the typed resolution artifact exchanged between jobs.
    required: false
    default: .paketabot/result.json
  paket-path:
    description: Paket executable used only by the resolve operation.
    required: false
    default: paket

outputs:
  outcome:
    description: One of updated, published, unchanged, or failed.
  pull-request-number:
    description: Pull request number when outcome is published.

runs:
  using: node24
  main: dist/index.js

branding:
  icon: package
  color: blue
